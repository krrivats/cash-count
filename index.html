<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0A0F1E"><title>Cash Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Cash Count design tokens. The note colours follow real Indian notes. The amber total looks like a fuel dispenser readout. */
:root{--bg:#0A0F1E;--p1:#111932;--p2:#17213D;--p3:#1F2B4E;--ln:#25315A;--ln2:#33416F;--tx:#E9EEFB;--mu:#8C97BA;--dim:#5E6890;
--go:#25CB8E;--go2:#179E6E;--amb:#FFB547;--amb2:#C99A5B;--bad:#FF6F6F;--wa:#25D366;
--d500:#BFC5B8;--d200:#F6A823;--d100:#AD91E6;--d50:#52C9EF;--d20:#C1DB61;--d10:#C88E60;--dc:#DCBB76;
--f:'Manrope',system-ui,-apple-system,sans-serif;--fd:'Rajdhani','Manrope',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 14px/1.4 var(--f);overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation;font-variant-numeric:tabular-nums}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(110% 38% at 50% -6%,#1B3B5E66,transparent 72%),linear-gradient(#ffffff05 1px,transparent 1px) 0 0/100% 30px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px;border-radius:10px}
.ic{display:inline-flex;flex:none}
/* Header */
header{display:flex;align-items:center;gap:10px;padding:8px 14px 6px}
.logo{width:34px;height:34px;flex:none}
.tt{flex:1;min-width:0}
.ttl{display:flex;align-items:center;gap:8px;min-width:0}
.ttl>b{font:700 21px/1 var(--fd);letter-spacing:.01em;white-space:nowrap}
.clk{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden}
.clk em{font-style:normal;color:var(--dim)}
.live{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go);flex:none}
.live.off{background:var(--amb);box-shadow:0 0 8px var(--amb)}
.live.no,.live.g{background:var(--dim);box-shadow:none}
@media (prefers-reduced-motion:no-preference){.live:not(.no):not(.g){animation:pl 2.4s ease-in-out infinite}}
@keyframes pl{50%{opacity:.4}}
.gear{position:relative;width:38px;height:38px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mu)}
.gear.due::after{content:'';position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--amb);box-shadow:0 0 0 2px var(--p1)}
.madeby{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--dim);font-weight:600;white-space:nowrap}
.madeby svg{width:11px;height:11px}.madeby strong{color:var(--mu)}
.credit{display:flex;justify-content:center;margin:18px 0 6px}.madeby.big{font-size:12px}.madeby.big svg{width:13px;height:13px}
/* Read-only banner */
.vbar{margin:0 12px 6px;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 11px;border-radius:12px;background:#FFB54714;border:1px solid #FFB54755;color:var(--amb);font-size:12.5px;font-weight:600}
.vbar>span:not(.ic){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vbar b{color:#FFD7A0}
.vbar button{height:30px;padding:0 12px;border-radius:9px;background:var(--amb);color:#2A1700;font-weight:800;font-size:12.5px}
/* Main + nav */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 12px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
nav{display:flex;gap:3px;margin:0 10px calc(8px + env(safe-area-inset-bottom,0px));padding:5px;border-radius:18px;background:#111932EE;border:1px solid var(--ln);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:13px;font-size:11px;font-weight:700;color:var(--mu);transition:background .2s,color .2s}
nav button.on{background:var(--p3);color:var(--tx)}nav button.on .ic{color:var(--amb)}
/* Type */
h2.pt{font:700 23px/1.1 var(--fd);margin:6px 2px 8px;letter-spacing:.01em}
.mu{color:var(--mu);margin:0 2px 8px;font-size:13px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 4px 6px;color:var(--mu);font-size:12.5px;font-weight:700}
.sh b{font:600 15px var(--fd);color:var(--tx)}
/* Note tag (the core visual) */
.dn{display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:52px;height:28px;padding:0 7px;border-radius:8px;font:700 17px/1 var(--fd);color:var(--c);background:#ffffff0a;background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.dn i{font-style:normal;font-size:11px;opacity:.75;margin-right:1px}
.dn.sm{min-width:0;height:22px;font-size:14px;padding:0 6px;border-radius:6px}
/* Cards + rows */
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px}
.rows{padding:2px 6px}
.row{display:grid;grid-template-columns:56px 34px minmax(44px,1fr) 34px 80px;gap:6px;align-items:center;height:var(--rh,42px);padding:0 2px;border-radius:10px;transition:background .25s}
.row+.row{box-shadow:0 -1px 0 #ffffff08}
.row.has{background:linear-gradient(90deg,#ffffff08,transparent 75%);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 75%)}
.sb{width:34px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--ln2);color:var(--mu);transition:transform .1s}
.sb.p{background:var(--go2);border-color:var(--go);color:#fff}
.sb:disabled{opacity:.35}
.q{width:100%;height:30px;border-radius:9px;border:1px solid var(--ln2);background:var(--bg);text-align:center;font:700 18px var(--fd);padding:0 4px}
.q:focus,.tx:focus{outline:none;border-color:var(--amb);box-shadow:0 0 0 3px #FFB54722}
.q.warn{border-color:var(--bad);color:#FFB3B3}
.am{text-align:right;font:600 16px var(--fd);color:var(--dim);white-space:nowrap}
.am.on{color:var(--tx)}
.am.bump{animation:bp .35s}@keyframes bp{40%{transform:scale(1.12);color:var(--amb)}}
.lrow{grid-template-columns:56px 1fr}
.lsw{display:flex;align-items:center;justify-content:flex-end;gap:6px;font:600 16px var(--fd);color:var(--mu)}
.lsw .q{width:120px;text-align:right;padding:0 10px}
/* Amber readout */
.ro{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 14px;border-radius:18px;background:repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 3px),linear-gradient(180deg,#1C1608,#120E07);border:1px solid #FFB54740;overflow:hidden}
.ro small{display:block;color:var(--amb2);font-size:11.5px;font-weight:700}
.ro b{display:block;font:700 34px/1.05 var(--fd);color:var(--amb);text-shadow:0 0 16px #FFB5474D;letter-spacing:.02em;white-space:nowrap}
.ro em{display:block;font-style:normal;color:var(--amb2);font-size:12px;margin-top:2px}
.ro .st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11.5px;color:var(--amb2);white-space:nowrap}
.ro .st b{display:inline;font:600 14px var(--fd);color:#FFD9A0;text-shadow:none}
.ro.glow{animation:gl .6s}@keyframes gl{0%{box-shadow:0 0 0 0 #FFB54766}100%{box-shadow:0 0 0 12px #FFB54700}}
.hero{margin-top:2px}
/* Buttons */
.btns{display:flex;gap:8px;margin-top:10px}
.b1,.b2,.b3{flex:1;min-width:0;height:46px;border-radius:14px;font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,opacity .2s;text-decoration:none;white-space:nowrap}
.b1{background:var(--go);color:#032419}
.b1.wa{background:var(--wa);color:#05230F}
.b2{background:var(--p2);border:1px solid var(--ln2);color:var(--tx)}
.b3{background:#FF6F6F12;border:1px solid #FF6F6F55;color:#FFA0A0}
.b1:active,.b2:active,.b3:active,.sb:active,.li:active{transform:scale(.97)}
.b1:disabled,.b2:disabled{opacity:.4;cursor:default}
.fit{flex:0 0 auto;padding:0 16px}
.wide{width:100%;flex:none}
.pill{height:32px;padding:0 13px;border-radius:999px;background:var(--p2);border:1px solid var(--ln2);font-weight:700;font-size:12.5px;white-space:nowrap}
/* Lists */
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:9px 10px;text-align:left;background:var(--p1);border:1px solid var(--ln);border-radius:14px;transition:transform .12s,border-color .2s}
.li.sel{border-color:var(--amb)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font:700 18px var(--fd);white-space:nowrap}
.li>.ic:last-child{color:var(--dim)}
.av{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;font:700 17px var(--fd);color:var(--c);background:#ffffff0d;background:color-mix(in srgb,var(--c) 17%,transparent)}
.dd{width:42px;flex:none;text-align:center;line-height:1}
.dd b{display:block;font:700 22px/1 var(--fd)}.dd small{display:block;color:var(--mu);font-size:11px;font-weight:700;margin-top:2px}
.bar{display:block;height:4px;margin-top:6px;border-radius:9px;background:var(--p3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--go2),var(--amb))}
.ed{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--ln2);color:var(--mu);flex:none}
@media (prefers-reduced-motion:no-preference){.in>*{animation:rise .32s both}.in>*:nth-child(2){animation-delay:.03s}.in>*:nth-child(3){animation-delay:.06s}.in>*:nth-child(4){animation-delay:.09s}.li.in{animation:rise .3s both;animation-delay:calc(var(--i,0)*25ms)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.empty{text-align:center;padding:34px 18px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font:700 18px var(--fd);margin-bottom:4px}
/* Top bar for sub screens */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.bk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--p1);border:1px solid var(--ln);flex:none}
.top b{display:block;font:700 20px/1.1 var(--fd)}.top small{display:block;color:var(--mu);font-size:12px}
/* Detail tables */
.nc{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:8px;min-height:40px;padding:0 4px}
.nc+.nc{box-shadow:0 -1px 0 #ffffff08}
.nc .qy{font:600 16px var(--fd);color:var(--mu)}
.nc.z{opacity:.45}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 14px;border-radius:14px;background:#FFB54712;border:1px solid #FFB54740;color:var(--amb2);font-weight:700}
.tot b{font:700 22px var(--fd);color:var(--amb)}
.chk{margin-top:8px;font-size:12.5px}
.note{padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);color:var(--mu);font-size:12.5px;margin:8px 0 0}
.note.warn{background:#FFB54712;border-color:#FFB54755;color:#FFD39A}
/* Settings */
.acc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--p1);border:1px solid var(--ln)}
.acc .m{flex:1;min-width:0}.acc .m b{display:block;font-weight:800}.acc .m small{display:block;color:var(--mu);font-size:12px}
/* Sheet + toast */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:#03060FAA;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fi .2s}
.sheet{position:relative;width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--p1);border:1px solid var(--ln2);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:su .26s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:'';position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:9px;background:var(--ln2)}
.sheet h2{font:700 21px var(--fd);margin:2px 0 6px}
.sheet .big{font:700 34px var(--fd);color:var(--amb);margin:2px 0 4px}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(24px);opacity:0}}
.fl{display:block;margin:10px 2px 5px;font-size:12.5px;color:var(--mu);font-weight:700}
.tx{width:100%;height:46px;padding:0 13px;border-radius:12px;border:1px solid var(--ln2);background:var(--bg);font-size:15px}
textarea.tx{height:110px;padding:10px;font:12px/1.4 ui-monospace,monospace}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sug:empty{display:none}
.sug button{height:30px;padding:0 12px;border-radius:999px;background:var(--p2);border:1px solid var(--ln2);font-size:13px;font-weight:700}
.opt{display:flex;gap:8px;margin-top:6px}.opt label{flex:1;display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--p2);border:1px solid var(--ln2);font-weight:700}
.wl{display:flex;justify-content:space-between;padding:9px 12px;font:600 15px var(--fd);color:#FFB3B3}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:999px;background:var(--p3);border:1px solid var(--ln2);font-weight:700;font-size:13.5px;box-shadow:0 10px 30px #0008;animation:tu .25s;overflow:hidden;white-space:nowrap}
@keyframes tu{from{opacity:0;transform:translate(-50%,-10px)}}
.toast .ub{color:var(--amb);font-weight:800}
.toast .tm{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--amb);transform-origin:left;animation:tmr 5s linear forwards}@keyframes tmr{to{transform:scaleX(0)}}
/* Login */
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
#login::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 45% at 50% 0,#1B3B5E77,transparent 70%),linear-gradient(#ffffff05 1px,transparent 1px) 0 0/100% 30px}
#login form{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#login .hd{text-align:center;margin-bottom:8px}#login .hd svg{width:60px;height:60px}
#login h1{font:700 30px/1 var(--fd);margin:8px 0 4px}
#login .hd p{color:var(--mu);margin:0;font-size:13.5px}
#login .err{min-height:18px;margin:0;color:var(--bad);font-size:13px;font-weight:600}
#login .b1,#login .b2{flex:none;width:100%}
#login .gh{margin:0;text-align:center;color:var(--dim);font-size:12px}
.demo{padding:8px 12px;border-radius:12px;background:#FFB54714;border:1px solid #FFB54755;color:#FFD39A;font-size:12.5px;text-align:center}
/* Bundles */
.bov{position:sticky;top:-2px;z-index:3;margin:0 -12px 8px;padding:6px 12px 8px;background:linear-gradient(var(--bg) 82%,#0A0F1E00)}
.bnum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.bnum div{padding:6px 10px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);min-width:0}
.bnum small{display:block;color:var(--mu);font-size:11px;font-weight:700;white-space:nowrap}
.bnum b{display:block;font:700 19px/1.15 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnum .g b{color:var(--go)}.bnum .a b{color:var(--amb)}
.meter{display:flex;gap:2px;height:10px;margin-top:6px;border-radius:999px;overflow:hidden;background:var(--p1);border:1px solid var(--ln)}
.meter i{height:100%;background:var(--c);transition:flex .35s}
.meter i.st{background:repeating-linear-gradient(45deg,#8C97BA66 0 3px,transparent 3px 7px)}
.stp{margin-bottom:10px;padding:12px;border-radius:18px;background:var(--p1);border:1px solid var(--ln)}
.sth{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sn{width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;font:700 16px var(--fd);background:var(--p3);color:var(--amb);border:1px solid var(--ln2)}
.sth>div{flex:1;min-width:0}
.sth h3{margin:0;font:700 17px/1.2 var(--fd)}.sth small{display:block;color:var(--mu);font-size:12px;margin-top:1px}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--bg);border:1px solid var(--ln)}
.seg button{flex:1;min-width:0;height:34px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--mu);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--p3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.seg.sm{flex:none}.seg.sm button{height:26px;padding:0 8px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--ln2);background:var(--p2);font-size:12.5px;font-weight:800;color:var(--mu)}
.chip[aria-pressed=true]{background:#FFB5471C;border-color:#FFB54799;color:var(--amb)}
.binfo{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--mu);font-size:12.5px}
.binfo b{color:var(--tx)}
.bsmall{color:var(--mu);font-size:12.5px;margin-top:6px}
.lnk{color:var(--amb);font-weight:800;font-size:12.5px;margin-left:6px}
.pick{display:flex;flex-direction:column;margin-top:8px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);max-height:260px;overflow:auto}
.pk{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:13.5px}
.pk+.pk{box-shadow:0 -1px 0 #ffffff08}
.pk input{width:18px;height:18px;accent-color:var(--go)}
.pk .m{flex:1;min-width:0}.pk .m small{display:block;color:var(--mu);font-size:11.5px}
.pk b{font:700 16px var(--fd)}.pk.done{opacity:.5}
.tag{margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--p3);color:var(--mu);font-size:10.5px;font-weight:800;white-space:nowrap}
.fb{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:8px;padding:7px 0}
.fb+.fb{box-shadow:0 -1px 0 #ffffff08}
.fb.off .bricks,.fb.off .fv{opacity:.45}
.bricks{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.bricks i{width:12px;height:18px;border-radius:3px;background:var(--c);box-shadow:inset 0 -3px 0 #0004}
.bricks i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--c);opacity:.45}
.fv{display:block;width:100%;color:var(--mu);font-size:11.5px;margin-top:3px}
.cnt{display:flex;align-items:center;gap:6px}
.cnt b{min-width:18px;text-align:center;font:700 18px var(--fd)}
.cnt .sb{width:30px;height:28px}
.sub{margin-top:10px;padding-top:10px;border-top:1px dashed var(--ln2)}
.subh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.subh h4{margin:0;font:700 15px var(--fd)}.subh small{display:block;color:var(--mu);font-size:11.5px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.opts label{color:var(--mu);font-size:12px;font-weight:700;margin-right:2px}
