<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080a12"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Cash Count</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#080a12;--s:#121627;--s2:#181d31;--b:#29314d;--g:#10b981;--g2:#6ee7b7;--t:#e2e8f0;--m:#718096;--r:#f87171}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{font:500 15px/1.35 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t)}button,input{font:inherit}button{border:0;color:inherit}input{min-width:0;font-size:16px}#app{max-width:480px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(90% 35% at 50% 0,#10b98120,transparent 70%)}header{height:58px;flex:none;display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #10b98120}header img{width:38px;height:38px}header b{font-size:18px}header small{display:block;color:var(--m);font-size:11px}.gear{margin-left:auto;width:38px;height:38px;border-radius:11px;background:var(--s);border:1px solid var(--b)}main{flex:1;overflow:auto;padding:4px 10px 10px}nav{height:60px;flex:none;display:flex;background:#0d1020;border-top:1px solid var(--b)}nav button{flex:1;background:none;color:var(--m);font-size:11px;font-weight:700}nav button.on{color:var(--g2)}h2{font-size:18px;margin:8px 2px 4px}h3{font-size:11px;color:var(--g2);letter-spacing:.08em;margin:6px 2px 3px;text-transform:uppercase}.card{background:linear-gradient(160deg,#161b30,#0d1020);border:1px solid #29314d;border-radius:13px;padding:3px 8px}.row{display:grid;grid-template-columns:42px 34px 1fr 34px 76px;gap:6px;align-items:center;height:36px;border-bottom:1px solid #29314d55}.row:last-child{border:0}.q,.loose{height:30px;background:#080a12;border:1px solid var(--b);border-radius:9px;color:var(--t);text-align:center;width:100%}.amt{text-align:right;color:var(--m);font-size:13px}.amt.on{color:var(--g2)}.ctl{width:34px;height:30px;border-radius:9px;background:#1b2138;border:1px solid var(--b);font-size:18px}.plus{color:white;background:#087f5b}.looseRow{display:flex;align-items:center;justify-content:space-between;min-height:42px}.loose{width:110px;text-align:right;padding:0 8px}.sum{display:flex;justify-content:space-between;color:var(--m);font-size:11px;padding:5px 2px}.sum b{color:var(--t)}.total{border-radius:14px;background:linear-gradient(135deg,#065f46,#10b981,#6ee7b7);color:#032a1e;padding:8px 14px;margin-top:2px}.total small{font-weight:800}.total strong{display:block;font-size:30px;line-height:1.1}.actions{display:flex;gap:8px;margin-top:7px}.actions button,.full{height:40px;border-radius:11px;font-weight:700}.save{flex:1;background:var(--g);color:white}.clear{width:90px;background:var(--s2);border:1px solid var(--b)}.item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:12px;background:var(--s);border:1px solid var(--b);margin-bottom:7px}.item div{flex:1;min-width:0}.item small{display:block;color:var(--m)}.money{color:var(--g2);font-weight:800}.back{width:38px;height:38px;border-radius:10px;background:var(--s);border:1px solid var(--b)}.empty{text-align:center;color:var(--m);padding:45px 15px}.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:5}.box{width:100%;max-width:480px;margin:auto;background:var(--s);border:1px solid var(--b);border-radius:18px 18px 0 0;padding:16px}.box input{width:100%;height:42px;background:#080a12;border:1px solid var(--b);border-radius:10px;color:white;padding:0 10px;margin:5px 0 10px}.modalBtns{display:flex;gap:8px}.modalBtns button{flex:1;height:42px;border-radius:11px}.danger{background:#7f1d1d;color:#fecaca}.secondary{background:var(--s2);border:1px solid var(--b)}.hidden{display:none}
</style></head>
<body><div id="app"><header><img src="icon.svg"><div><b>Cash Count</b><small id="date"></small></div><button class="gear" id="settings">⚙️</button></header><main id="main"></main><nav><button data-tab="calc">▣<br>Calculator</button><button data-tab="today">◷<br>Today</button><button data-tab="history">↺<br>History</button></nav></div>
<script>
const N=[['n500',500],['n200',200],['n100',100],['n50',50],['n20',20],['n10',10]],C=[['c5',5],['c2',2],['c1',1]],A=[...N,...C],KEY='cash-count-entries';
let entries=load(),tab='calc',view=null,d=Object.fromEntries(A.map(x=>[x[0],0])),loose=0;
const $=s=>document.querySelector(s),fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN'),today=()=>new Date().toISOString().slice(0,10);
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function modal(title,body,ok,fn,danger=false){const s=document.createElement('div');s.className='sheet';s.innerHTML='<div class="box"><h2>'+title+'</h2>'+body+'<div class="modalBtns"><button class="secondary" id="mc">Cancel</button><button class="'+(danger?'danger':'save')+'" id="mo">'+ok+'</button></div></div>';document.body.append(s);$('#mc').onclick=()=>s.remove();$('#mo').onclick=()=>{s.remove();fn()}}
function total(){return A.reduce((x,[k,v])=>x+d[k]*v,0)+loose}
function counter(arr){return '<div class="card">'+arr.map(([k,v])=>'<div class="row"><b>₹'+v+'</b><button class="ctl" data-minus="'+k+'">−</button><input class="q" inputmode="numeric" value="'+(d[k]||'')+'" data-q="'+k+'"><button class="ctl plus" data-plus="'+k+'">+</button><span class="amt '+(d[k]?'on':'')+'">'+fmt(d[k]*v)+'</span></div>').join('')+'</div>'}
function calc(){return '<div><h3>Notes</h3>'+counter(N)+'<h3>Coins</h3>'+counter(C)+'<h3>Loose Change</h3><div class="card looseRow"><b>Loose Change</b><input class="loose" inputmode="numeric" value="'+(loose||'')+'" id="loose"></div><div class="sum"><span>Notes <b>'+N.reduce((x,[k])=>x+d[k],0)+'</b></span><span>Coins <b>'+C.reduce((x,[k])=>x+d[k],0)+'</b></span><span>Loose <b>'+fmt(loose)+'</b></span></div><div class="total"><small>TOTAL CASH</small><strong>'+fmt(total())+'</strong></div><div class="actions"><button class="save" id="saveEntry">Save Entry</button><button class="clear" id="clear">Clear</button></div></div>'}
function todayScreen(){let L=entries.filter(e=>e.date===today());return '<h2>Today</h2><small style="color:var(--m)">'+today()+'</small>'+list(L,'TOTAL COLLECTION')}
function history(){let days=[...new Set(entries.map(e=>e.date))].sort().reverse();return '<h2>History</h2>'+days.map(day=>{let L=entries.filter(e=>e.date===day);return '<button class="item" data-day="'+day+'"><div><b>'+day+'</b><small>'+L.length+' entries</small></div><span class="money">'+fmt(L.reduce((s,e)=>s+e.amount,0))+'</span></button>'}).join('')||'<div class="empty">No saved entries yet.</div>'}
function list(L,label){if(!L.length)return '<div class="empty">No entries saved today yet.<br>Use Calculator to save cash.</div>';let m={};L.forEach(e=>{let k=(e.person||'General').toLowerCase();if(!m[k])m[k]={name:e.person||'General',n:0,sum:0};m[k].n++;m[k].sum+=e.amount});return Object.values(m).sort((a,b)=>b.sum-a.sum).map(x=>'<button class="item"><div><b>'+x.name+'</b><small>'+x.n+' entr'+(x.n===1?'y':'ies')+'</small></div><span class="money">'+fmt(x.sum)+'</span></button>').join('')+'<div class="total"><small>'+label+'</small><strong>'+fmt(L.reduce((s,e)=>s+e.amount,0))+'</strong></div>'}
function settings(){return '<h2>Settings</h2><h3>Backup</h3><button class="item" id="export">Export Backup</button><button class="item" id="import">Import Backup</button><h3>Data</h3><button class="item" id="clearAll" style="color:#fca5a5">Delete All Data</button><p style="color:var(--m);font-size:12px">'+entries.length+' entries stored locally on this device.</p>'}
function render(){let m=$('#main');m.innerHTML=view?detail():tab==='calc'?calc():tab==='today'?todayScreen():history();$('#date').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});bind()}
function updateCalculatorWithoutRerender(active){const main=$('#main');const focused=active;const start=focused.selectionStart,end=focused.selectionEnd;main.innerHTML=calc();bind();const again=document.querySelector(`[data-q="${focused.dataset.q}"]`)||$('#loose');if(again){again.focus({preventScroll:true});try{again.setSelectionRange(start,end)}catch{} }}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;view=null;render()}});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{d[b.dataset.plus]++;render()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{d[b.dataset.minus]=Math.max(0,d[b.dataset.minus]-1);render()});document.querySelectorAll('[data-q]').forEach(i=>{i.oninput=()=>{d[i.dataset.q]=parseInt(i.value.replace(/\D/g,''))||0;updateCalculatorWithoutRerender(i)}});let l=$('#loose');if(l)l.oninput=()=>{loose=parseInt(l.value.replace(/\D/g,''))||0;updateCalculatorWithoutRerender(l)};let s=$('#saveEntry');if(s)s.onclick=()=>{if(!total())return;modal('Save Entry','<label style="color:var(--m)">Person / Source (optional)</label><input id="person" placeholder="Ankit, Rahul, General"><label style="color:var(--m)">Note (optional)</label><input id="note" placeholder="Morning collection">','Save',()=>{let p=($('#person').value.trim()||'General');entries.push({id:Date.now().toString(36)+Math.random(),person:p,note:$('#note').value.trim(),amount:total(),denominations:{...d},looseChange:loose,date:today(),timestamp:Date.now()});save();d=Object.fromEntries(A.map(x=>[x[0],0]));loose=0;render()})};let cl=$('#clear');if(cl)cl.onclick=()=>modal('Clear calculator?','<p style="color:var(--m)">Saved entries will not be affected.</p>','Clear',()=>{d=Object.fromEntries(A.map(x=>[x[0],0]));loose=0;render()});let set=$('#settings');if(set)set.onclick=()=>{view='settings';render()};let ex=$('#export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify({app:'cash-count',version:1,entries},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cash-count-backup-'+today()+'.json';a.click()};let imp=$('#import');if(imp)imp.onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{let j=JSON.parse(t);if(!Array.isArray(j.entries))throw 0;entries=[...entries,...j.entries.filter(x=>!entries.some(e=>e.id===x.id))];save();render()}catch{alert('Invalid backup file')}});i.click()};let ca=$('#clearAll');if(ca)ca.onclick=()=>modal('Delete all data?','<p style="color:var(--m)">This permanently deletes all saved records from this browser.</p>','Delete',()=>{entries=[];save();view=null;render()},true);document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{view={day:b.dataset.day};render()})}
function detail(){if(view==='settings')return settings();let L=entries.filter(e=>e.date===view.day);return '<button class="back" onclick="view=null;render()">←</button><h2>'+view.day+'</h2>'+list(L,'TOTAL') }
render();
</script></body></html>
