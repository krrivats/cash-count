<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cash Count — Layout Demo</title>
<style>
:root{--bg:#080a12;--panel:#0f1220;--line:#252d4a;--text:#e6edf7;--muted:#70809e;--accent:#16c784}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input{font:inherit}button{border:0}.app{height:100dvh;max-width:430px;margin:auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.header{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid #1b2137;background:#0d1020}.brand{display:flex;align-items:center;gap:9px}.logo{width:31px;height:31px;border:2px solid #18c995;border-radius:7px;display:grid;place-items:center;color:#18c995;font-weight:800;font-size:15px}.brand h1{margin:0;font-size:16px;line-height:18px}.brand p{margin:2px 0 0;color:#65738e;font-size:11px}.gear{width:34px;height:34px;background:transparent;color:#91a0bb;font-size:22px}.content{flex:0 0 auto;padding:5px 12px 4px}.section-title{font-size:10px;font-weight:800;letter-spacing:.12em;color:#71809d;margin:0 0 3px 2px;text-transform:uppercase}.box{border:1px solid var(--line);border-radius:13px;background:rgba(15,18,32,.72);padding:3px 9px}.notes{margin-bottom:6px}.coins{margin-bottom:6px}.row{height:34px;min-height:34px;display:grid;grid-template-columns:70px 30px 38px 30px 1fr;align-items:center;column-gap:5px}.label{font-size:14px;font-weight:750}.ctrl{height:30px;width:30px;border-radius:8px;background:#171b2d;color:#6b748a;display:grid;place-items:center;font-size:18px}.ctrl.plus{background:var(--accent);color:white;font-size:20px}.qty{width:38px;height:30px;border-radius:8px;border:1px solid #293252;background:#171b2d;color:#e9eef7;text-align:center;font-size:16px;font-weight:700;outline:none}.amount{text-align:right;color:#65748f;font-size:12px;font-weight:700;white-space:nowrap}.loose{height:48px;display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:5px}.loose-label{font-size:15px;font-weight:750;flex:1}.rupee{color:var(--accent);font-weight:800}.loose input{height:32px;width:82px;border-radius:9px;border:1px solid #293252;background:#171b2d;color:#e9eef7;text-align:right;padding:0 8px;font-size:16px;outline:none}.summary{height:25px;display:flex;align-items:center;gap:16px;padding:0 4px;color:#71809d;font-size:11px}.summary b{color:#d9e1ed}.bottom{margin-top:0;border-top:1px solid #1d243b;padding:6px 12px 7px;background:#0b0e19}.total{height:70px;border-radius:14px;background:linear-gradient(110deg,#3e9f73,#14c685);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:6px}.total small{font-size:10px;letter-spacing:.14em;color:#d7f7eb}.total strong{font-size:27px;line-height:30px}.actions{display:flex;gap:8px}.save{height:42px;flex:1;border-radius:13px;background:var(--accent);color:white;font-weight:750;font-size:15px}.clear{height:42px;width:112px;border-radius:13px;background:#15192b;border:1px solid var(--line);color:#8d9ab2;font-weight:700;font-size:14px}.nav{height:61px;flex:0 0 61px;border-top:1px solid #1b2137;background:#0d1020;display:flex}.nav button{flex:1;background:transparent;color:#56637d;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav button.active{color:#49dca8}.nav .ico{font-size:20px;line-height:20px}@media (max-height:720px){.header{height:52px;flex-basis:52px}.content{padding-top:3px}.row{height:31px;min-height:31px}.ctrl,.qty{height:28px}.box{padding-top:2px;padding-bottom:2px}.total{height:64px}.actions button{height:39px}.nav{height:56px;flex-basis:56px}}
</style>
</head>
<body>
<div class="app"><header class="header"><div class="brand"><div class="logo">₹</div><div><h1>Cash Count</h1><p>02 Oct 2026</p></div></div><button class="gear">⚙︎</button></header><main class="content"><section class="notes"><h2 class="section-title">Notes</h2><div class="box" id="notes"></div></section><section class="coins"><h2 class="section-title">Coins</h2><div class="box" id="coins"></div></section><div class="loose box"><span class="loose-label">Loose Change</span><span class="rupee">₹</span><input id="loose" inputmode="numeric" value=""></div><div class="summary"><span>Notes <b id="noteQty">0</b></span><span>Coins <b id="coinQty">0</b></span><span>Loose <b id="looseSum">₹0</b></span></div></main><section class="bottom"><div class="total"><small>TOTAL CASH</small><strong id="total">₹0</strong></div><div class="actions"><button class="save">▣ &nbsp; Save Entry</button><button class="clear" id="clear">♢ &nbsp; Clear</button></div></section><nav class="nav"><button class="active"><span class="ico">▦</span>Calculator</button><button><span class="ico">▣</span>Today</button><button><span class="ico">◴</span>History</button></nav></div>
<script>
const notes=[500,200,100,50,20,10],coins=[5,2,1],qty={};[...notes,...coins].forEach(v=>qty[v]=0);const money=n=>"₹"+Number(n).toLocaleString("en-IN");
function row(v){const d=document.createElement("div");d.className="row";d.innerHTML=`<span class="label">₹${v}</span><button class="ctrl">−</button><input class="qty" inputmode="numeric" value=""><button class="ctrl plus">+</button><span class="amount">₹0</span>`;const input=d.querySelector("input"),amount=d.querySelector(".amount"),minus=d.querySelector(".ctrl"),plus=d.querySelector(".plus");function render(){input.value=qty[v]||"";amount.textContent=money(v*qty[v]);minus.style.opacity=qty[v]?"1":".35";update()}input.addEventListener("input",()=>{qty[v]=parseInt(input.value.replace(/\D/g,""))||0;render()});input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const all=[...document.querySelectorAll(".qty")],i=all.indexOf(input);(all[i+1]||document.getElementById("loose")).focus()}});input.addEventListener("focus",e=>e.target.select());minus.onclick=()=>{qty[v]=Math.max(0,qty[v]-1);render()};plus.onclick=()=>{qty[v]++;render()};render();return d}
notes.forEach(v=>document.getElementById("notes").appendChild(row(v)));coins.forEach(v=>document.getElementById("coins").appendChild(row(v)));const loose=document.getElementById("loose");loose.addEventListener("input",update);function update(){let nq=0,cq=0,total=0;notes.forEach(v=>{nq+=qty[v];total+=v*qty[v]});coins.forEach(v=>{cq+=qty[v];total+=v*qty[v]});const l=parseInt(loose.value.replace(/\D/g,""))||0;total+=l;document.getElementById("noteQty").textContent=nq;document.getElementById("coinQty").textContent=cq;document.getElementById("looseSum").textContent=money(l);document.getElementById("total").textContent=money(total)}document.getElementById("clear").onclick=()=>{[...notes,...coins].forEach(v=>qty[v]=0);loose.value="";document.querySelectorAll(".qty").forEach(x=>x.value="");update()};
</script></body></html>
