<!doctype html>

<title>Cash Count</title>
<style>
:root{--bg:#080a12;--ink900:#0d1020;--ink850:#121627;--ink800:#161b30;--ink750:#1b2138;--ink700:#232a45;--ink600:#2e3656;--a300:#6ee7b7;--a400:#34d399;--a500:#10b981;--a600:#059669;--red:#ef4444;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}button,input,textarea{font:inherit}input,textarea{font-size:16px}button{border:0}.app{height:100dvh;width:100%;max-width:448px;margin:auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink800);background:rgba(13,16,32,.92);padding:8px 12px;backdrop-filter:blur(10px)}.brand{display:flex;align-items:center;gap:8px}.logo{width:28px;height:28px}.brand h1{margin:0;font-size:14px;line-height:16px;font-weight:800}.brand p{margin:1px 0 0;font-size:10px;color:#64748b}.iconbtn{width:36px;height:36px;border-radius:9px;background:transparent;color:#94a3b8;display:grid;place-items:center}.iconbtn:active,.navbtn:active,.btn:active,.card:active{transform:scale(.97)}.main{min-height:0;flex:1;overflow:hidden}.screen{height:100%;display:flex;flex-direction:column}.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}.nav{flex:0 0 auto;display:flex;border-top:1px solid var(--ink800);background:rgba(13,16,32,.92);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}.navbtn{flex:1;padding:8px 2px;background:transparent;color:#475569;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500}.navbtn.active{color:var(--a400)}.ico{font-size:20px;line-height:20px}.section{margin:3px 12px 5px}.labeltitle{margin:0 2px 2px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#64748b}.denombox,.card{border:1px solid var(--ink700);background:rgba(18,22,39,.62);border-radius:12px}.denombox{padding:4px 10px}.row{height:28px;min-height:28px;display:flex;align-items:center;gap:4px;overflow:hidden}.row .denom{width:40px;flex:0 0 40px;font-size:14px;font-weight:800}.row .grow{min-width:0;flex:1;display:flex;align-items:center;gap:4px}.mini{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:#232a45;color:#cbd5e1;display:grid;place-items:center;font-size:17px}.mini.plus{background:var(--a500);color:white}.qty{width:40px;height:28px;flex:0 0 40px;border-radius:8px;border:1px solid var(--ink700);background:var(--ink800);color:#f1f5f9;text-align:center;font-weight:700;outline:0}.amount{width:4.5rem;flex:0 0 4.5rem;text-align:right;font-size:12px;font-weight:700;color:#64748b}.amount.live{color:var(--a300)}.loose{display:flex;align-items:center;gap:8px;padding:5px 12px;min-height:40px;margin:0 12px 4px}.loose span:first-child{flex:1;font-size:15px;font-weight:800}.rupee{color:var(--a400);font-weight:800}.loose input{width:80px;height:32px;border-radius:8px;border:1px solid var(--ink700);background:var(--ink800);color:#f1f5f9;text-align:right;padding:0 8px;outline:0}.summary{min-height:20px;display:flex;align-items:center;gap:12px;padding:0 13px;color:#64748b;font-size:10px}.summary b{color:#cbd5e1}.calc-bottom{flex:0 0 auto;border-top:1px solid var(--ink700);background:rgba(13,16,32,.88);padding:4px 12px 5px}.total{border-radius:12px;background:linear-gradient(90deg,var(--a600),var(--a500));text-align:center;padding:3px 16px;margin-bottom:4px}.total small{display:block;font-size:10px;letter-spacing:.12em;color:#d1fae5}.total strong{display:block;font-size:23px;line-height:25px;color:white}.actions{display:flex;gap:8px}.btn{height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700}.save{flex:1;background:var(--a500);color:#fff}.clear{padding:0 13px;background:var(--ink800);border:1px solid var(--ink700);color:#94a3b8}.topbar{flex:0 0 auto;border-bottom:1px solid var(--ink700);background:var(--ink900);padding:9px 16px}.topbar h2{margin:0;font-size:14px}.topbar p{margin:2px 0 0;font-size:11px;color:#64748b}.list{padding:12px 16px}.empty{margin-top:48px;text-align:center;color:#475569;font-size:13px}.empty small{display:block;margin-top:4px;color:#334155;font-size:11px}.card{width:100%;padding:11px 13px;margin-bottom:8px;text-align:left;color:inherit}.personcard,.datecard{display:flex;align-items:center;justify-content:space-between}.card .name{font-size:14px;font-weight:700;color:#f1f5f9}.card .sub{font-size:11px;color:#64748b;margin-top:2px}.money{font-size:14px;font-weight:800;color:var(--a300)}.footer-total{flex:0 0 auto;border-top:1px solid var(--ink700);background:rgba(13,16,32,.85);padding:9px 16px}.footer-total div{display:flex;align-items:center;justify-content:space-between}.footer-total small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b}.footer-total strong{font-size:18px;color:var(--a400)}.backrow{display:flex;align-items:center;gap:7px}.backrow h2{font-size:14px;margin:0}.backrow p{margin:2px 0 0;font-size:11px;color:#64748b}.contentpad{padding:12px 16px}.breakdown{border:1px solid var(--ink700);background:rgba(18,22,39,.62);border-radius:12px;padding:5px 12px;margin-bottom:10px}.breakline{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.breakline.zero{opacity:.4}.noteBox{border:1px solid var(--ink700);background:var(--ink850);border-radius:8px;padding:8px 12px;margin-bottom:10px}.noteBox small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:800}.noteBox div{font-size:14px;margin-top:2px;color:#cbd5e1}.formpad{padding:10px 12px}.fieldlabel{display:block;margin:0 0 4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#64748b}.field{width:100%;height:40px;border-radius:8px;border:1px solid var(--ink700);background:var(--ink800);color:#f1f5f9;padding:0 12px;outline:0;margin-bottom:8px}.edit-bottom{flex:0 0 auto;border-top:1px solid var(--ink700);background:rgba(13,16,32,.88);padding:8px 12px}.danger{height:40px;border-radius:11px;background:rgba(127,29,29,.2);border:1px solid rgba(153,27,27,.5);color:#f87171;padding:0 16px;font-weight:700}.modalback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:100%;max-width:330px;border:1px solid var(--ink700);border-radius:16px;background:#121627;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.45)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead h3{margin:0;font-size:16px}.modal p{font-size:13px;color:#94a3b8}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1;height:40px;border-radius:11px;font-weight:700}.cancel{background:var(--ink800);border:1px solid var(--ink700);color:#cbd5e1}.confirm{background:var(--a500);color:white}.confirm.red{background:var(--red)}.amountbox{border:1px solid rgba(16,185,129,.35);background:rgba(16,185,129,.1);border-radius:8px;text-align:center;padding:7px;margin-bottom:10px;color:var(--a300);font-size:18px;font-weight:800}.suggest{border:1px solid var(--ink700);background:var(--ink850);border-radius:8px;overflow:hidden;margin-top:-4px;margin-bottom:8px}.suggest button{display:block;width:100%;background:transparent;color:#cbd5e1;text-align:left;padding:8px 12px}.settingsGroup{padding:14px 16px}.settingsTitle{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin-bottom:8px}.settingbtn{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--ink700);background:var(--ink850);color:#e2e8f0;border-radius:12px;padding:11px 13px;margin-bottom:8px;text-align:left;font-size:14px;font-weight:700}.settingbtn.red{background:rgba(127,29,29,.18);border-color:rgba(153,27,27,.4);color:#f87171}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:60;background:var(--a500);color:white;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3)}@media(max-height:720px){.row{height:27px;min-height:27px}.mini,.qty{height:27px}.total strong{font-size:21px}.navbtn{padding-top:6px;padding-bottom:6px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const NOTES=[['500','n500'],['200','n200'],['100','n100'],['50','n50'],['20','n20'],['10','n10']],COINS=[['5','c5'],['2','c2'],['1','c1']];
const KEY='cash-count-entries';let entries=load();let tab='calculator';let view=null;let calc=empty();let loose='';let modal=null;let toastTimer=null;
const money=n=>{n=Math.round(Number(n)||0);if(!n)return '₹0';return '₹'+n.toLocaleString('en-IN')};
function empty(){return {n500:0,n200:0,n100:0,n50:0,n20:0,n10:0,c5:0,c2:0,c1:0}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(valid):[]}catch{return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function valid(e){return e&&typeof e.id==='string'&&typeof e.person==='string'&&typeof e.note==='string'&&typeof e.amount==='number'&&typeof e.timestamp==='number'&&e.denominations&&typeof e.looseChange==='number'}
function total(d,l){return [...NOTES,...COINS].reduce((s,[v,k])=>s+Number(v)*Number(d[k]||0),0)+Number(l||0)}
function dateKey(ts=Date.now()){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLong(d){return String(d.getDate()).padStart(2,'0')+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear()}
function time(ts){let d=new Date(ts),h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap}
function icon(s){return s}
function logo(){return '<svg class="logo" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient></defs><rect x="6" y="14" width="28" height="20" rx="3" fill="#1b2138" stroke="url(#lg)" stroke-width="1.5"/><rect x="10" y="10" width="28" height="20" rx="3" fill="#161b30" stroke="url(#lg)" stroke-width="1.5"/><rect x="14" y="6" width="28" height="20" rx="3" fill="url(#lg)"/><text x="28" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#080a12">₹</text><circle cx="36" cy="36" r="8" fill="#1b2138" stroke="url(#lg)" stroke-width="1.5"/><text x="36" y="39" text-anchor="middle" font-size="7" font-weight="bold" fill="#34d399">₹</text></svg>'}
function header(){return '<header class="header"><div class="brand">'+logo()+'<div><h1>Cash Count</h1><p>'+dateLong(new Date())+'</p></div></div><button class="iconbtn" onclick="openSettings()" aria-label="Settings">⚙︎</button></header>'}
function nav(){if(view)return '';return '<nav class="nav"><button class="navbtn '+(tab==='calculator'?'active':'')+'" onclick="go(\'calculator\')"><span class="ico">▦</span>Calculator</button><button class="navbtn '+(tab==='today'?'active':'')+'" onclick="go(\'today\')"><span class="ico">▣</span>Today</button><button class="navbtn '+(tab==='history'?'active':'')+'" onclick="go(\'history\')"><span class="ico">◴</span>History</button></nav>'}
function row(v,k){let q=calc[k]||0,a=Number(v)*q;return '<div class="row"><span class="denom">₹'+v+'</span><div class="grow"><button class="mini" onclick="change(\''+k+'\',-1)" '+(!q?'disabled':'')+'>−</button><input class="qty" inputmode="numeric" value="'+(q||'')+'" onfocus="this.select()" oninput="setq(\''+k+'\',this.value)" data-key="'+k+'"><button class="mini plus" onclick="change(\''+k+'\',1)">+</button></div><span class="amount '+(a?'live':'')+'">'+money(a)+'</span></div>'}
function calculator(){let nq=NOTES.reduce((s,[v,k])=>s+calc[k],0),cq=COINS.reduce((s,[v,k])=>s+calc[k],0),l=parseInt(loose)||0,a=total(calc,l);return '<div class="screen"><div class="scroll"><section class="section"><h2 class="labeltitle">Notes</h2><div class="denombox">'+NOTES.map(x=>row(...x)).join('')+'</div></section><section class="section"><h2 class="labeltitle">Coins</h2><div class="denombox">'+COINS.map(x=>row(...x)).join('')+'</div></section><div class="loose denombox"><span>Loose Change</span><span class="rupee">₹</span><input inputmode="numeric" value="'+loose+'" oninput="loose=this.value.replace(/\\D/g,\'\');render()" onfocus="this.select()"></div><div class="summary"><span>Notes <b>'+nq+'</b></span><span>Coins <b>'+cq+'</b></span><span>Loose <b>'+money(l)+'</b></span></div></div><div class="calc-bottom"><div class="total"><small>Total Cash</small><strong>'+money(a)+'</strong></div><div class="actions"><button class="btn save" onclick="saveModal()">▣ Save Entry</button><button class="btn clear" onclick="confirmClear()">♢ Clear</button></div></div></div>'}
function top(title,sub,back){return '<div class="topbar"><div class="backrow">'+(back?'<button class="iconbtn" onclick="'+back+'">‹</button>':'')+'<div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div></div></div>'}
function today(){let k=dateKey(),ps=groupPersons(k);return '<div class="screen">'+top("Today's Cash Collection",'<span>▣</span> '+dateLong(new Date()))+'<div class="scroll list">'+(ps.length?ps.map(p=>personCard(p,k)).join(''):'<div class="empty">No entries saved today yet.<small>Use the Calculator to count and save cash.</small></div>')+'</div><div class="footer-total"><div><small>Total Collection</small><strong>'+money(ps.reduce((s,p)=>s+p.total,0))+'</strong></div></div></div>'}
function groupPersons(k){let m=new Map();entries.filter(e=>dateKey(e.timestamp)===k).forEach(e=>{let key=e.person.toLowerCase(),x=m.get(key);if(x){x.total+=e.amount;x.count++}else m.set(key,{person:e.person,total:e.amount,count:1})});return [...m.values()].sort((a,b)=>b.total-a.total)}
function personCard(p,k){return '<button class="card personcard" onclick="person(\''+encodeURIComponent(p.person)+'\',\''+k+'\')"><div><div class="name">'+esc(p.person)+'</div><div class="sub">'+p.count+' '+(p.count===1?'entry':'entries')+'</div></div><span class="money">'+money(p.total)+'</span></button>'}
function history(){let m=new Map();entries.forEach(e=>{let k=dateKey(e.timestamp),x=m.get(k);if(x){x.total+=e.amount;x.count++}else m.set(k,{k,total:e.amount,count:1})});let days=[...m.values()].sort((a,b)=>b.k.localeCompare(a.k));return '<div class="screen">'+top('History')+'<div class="scroll list">'+(days.length?days.map(d=>'<button class="card datecard" onclick="day(\''+d.k+'\')"><div><div class="name">'+formatKey(d.k)+'</div><div class="sub">'+d.count+' '+(d.count===1?'entry':'entries')+'</div></div><div><span class="money">'+money(d.total)+'</span> ›</div></button>').join(''):'<div class="empty">No saved entries yet.<small>Saved cash counts will appear here grouped by date.</small></div>')+'</div></div>'}
function day(k){view={type:'day',k};render()}
function person(p,k){view={type:'person',person:decodeURIComponent(p),k};render()}
function personView(){let p=view.person,k=view.k,es=entries.filter(e=>e.person.toLowerCase()===p.toLowerCase()&&dateKey(e.timestamp)===k).sort((a,b)=>a.timestamp-b.timestamp),t=es.reduce((s,e)=>s+e.amount,0);return '<div class="screen">'+top(p,formatKey(k), "backView()")+'<div class="scroll list">'+es.map(e=>'<div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><button style="flex:1;background:transparent;text-align:left;color:inherit" onclick="transaction(\''+e.id+'\')"><div class="sub">'+time(e.timestamp)+'</div><div class="name" style="font-size:16px">'+money(e.amount)+'</div>'+(e.note?'<div class="sub">'+esc(e.note)+'</div>':'')+'</button><button class="iconbtn" onclick="edit(\''+e.id+'\')">✎</button><button class="iconbtn" onclick="transaction(\''+e.id+'\')">›</button></div></div>').join('')+'</div><div class="footer-total"><div><small>Total</small><strong>'+money(t)+'</strong></div></div></div>'}
function dayView(){let ps=groupPersons(view.k),t=ps.reduce((s,p)=>s+p.total,0);return '<div class="screen">'+top(formatKey(view.k),ps.length+' '+(ps.length===1?'person':'people'),"backView()")+'<div class="scroll list">'+ps.map(p=>personCard(p,view.k)).join('')+'</div><div class="footer-total"><div><small>Total</small><strong>'+money(t)+'</strong></div></div></div>'}
function transaction(){let id=arguments[0],e=entries.find(x=>x.id===id);if(e){view={type:'tx',e};render()}}
function txView(){let e=view.e, noteRows=NOTES.map(([v,k])=>'<div class="breakline '+(!e.denominations[k]?'zero':'')+'"><span><b>₹'+v+'</b> × '+(e.denominations[k]||0)+'</span><span class="money">'+money(Number(v)*(e.denominations[k]||0))+'</span></div>').join(''),coinRows=COINS.map(([v,k])=>'<div class="breakline '+(!e.denominations[k]?'zero':'')+'"><span><b>₹'+v+'</b> × '+(e.denominations[k]||0)+'</span><span class="money">'+money(Number(v)*(e.denominations[k]||0))+'</span></div>').join('');return '<div class="screen">'+top(e.person,formatKey(dateKey(e.timestamp))+' · '+time(e.timestamp),"backView()")+'<div class="scroll contentpad">'+(e.note?'<div class="noteBox"><small>Note</small><div>'+esc(e.note)+'</div></div>':'')+'<h3 class="labeltitle">Notes</h3><div class="breakdown">'+noteRows+'</div><h3 class="labeltitle">Coins</h3><div class="breakdown">'+coinRows+'</div><div class="card" style="display:flex;justify-content:space-between"><span style="color:#94a3b8">Loose Change</span><span class="money">'+money(e.looseChange)+'</span></div></div><div class="footer-total"><div><small>Total</small><strong>'+money(e.amount)+'</strong></div></div></div>'}
function edit(id){let e=entries.find(x=>x.id===id);if(e){view={type:'edit',e:JSON.parse(JSON.stringify(e))};render()}}
function editView(){let e=view.e,d=e.denominations;return '<div class="screen">'+top('Edit Entry',null,"backView()")+'<div class="scroll formpad"><label class="fieldlabel">Person / Source</label><input class="field" id="eperson" value="'+escAttr(e.person)+'"><label class="fieldlabel">Note (optional)</label><input class="field" id="enote" value="'+escAttr(e.note)+'" placeholder="e.g. Morning collection"><h3 class="labeltitle">Notes</h3><div class="denombox" style="margin-bottom:8px">'+NOTES.map(([v,k])=>editRow(v,k,d[k])).join('')+'</div><h3 class="labeltitle">Coins</h3><div class="denombox" style="margin-bottom:8px">'+COINS.map(([v,k])=>editRow(v,k,d[k])).join('')+'</div><div class="loose denombox" style="margin:0 0 8px"><span>Loose Change</span><span class="rupee">₹</span><input id="eloose" inputmode="numeric" value="'+(e.looseChange||'')+'"></div></div><div class="edit-bottom"><div class="total" style="margin-bottom:7px"><small>Total Cash</small><strong id="editTotal">'+money(total(d,e.looseChange))+'</strong></div><div class="actions"><button class="danger" onclick="deleteEdit()">Delete</button><button class="btn save" onclick="saveEdit()">▣ Save Changes</button></div></div></div>'}
function editRow(v,k,q){return '<div class="row"><span class="denom">₹'+v+'</span><div class="grow"><button class="mini" onclick="editChange(\''+k+'\',-1)">−</button><input class="qty erow" data-k="'+k+'" value="'+(q||'')+'" inputmode="numeric"><button class="mini plus" onclick="editChange(\''+k+'\',1)">+</button></div><span class="amount '+(q?'live':'')+'">'+money(Number(v)*q)+'</span></div>'}
function settings(){return '<div class="screen">'+top('Settings',null,"closeSettings()")+'<div class="scroll settingsGroup"><div class="settingsTitle">Backup</div><button class="settingbtn" onclick="exportData()">↓ Export Backup</button><button class="settingbtn" onclick="document.getElementById(\'importFile\').click()">↑ Import Backup</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"><div class="settingsTitle" style="margin-top:20px">Data</div><button class="settingbtn red" onclick="confirmClearAll()">♲ Clear All Data</button><p style="font-size:11px;color:#475569;margin-top:14px">'+entries.length+' '+(entries.length===1?'entry':'entries')+' stored locally in this browser.</p><p style="font-size:11px;color:#334155">All data stays on your device. Nothing is sent to any server.</p></div></div>'}
function render(){document.getElementById('app').innerHTML=header()+'<div class="main">'+(modal?baseView():view?(view.type==='person'?personView():view.type==='day'?dayView():view.type==='tx'?txView():editView()):tab==='calculator'?calculator():tab==='today'?today():history())+'</div>'+nav()+(modal?modalHtml(): '');}
function baseView(){return view?(view.type==='person'?personView():view.type==='day'?dayView():view.type==='tx'?txView():editView()):tab==='calculator'?calculator():tab==='today'?today():history()}
function go(t){tab=t;view=null;render()}function backView(){view=null;render()}function openSettings(){modal=null;view={type:'settings'};render()}function closeSettings(){view=null;render()}
function setq(k,v){calc[k]=parseInt(String(v).replace(/\D/g,''))||0;render()}function change(k,n){calc[k]=Math.max(0,(calc[k]||0)+n);render()}
function saveModal(){modal={type:'save'};render()}function confirmClear(){modal={type:'confirm',title:'Clear calculator?',msg:'This will reset all quantities and loose change to zero. Saved entries are not affected.',action:'clear'};render()}function confirmClearAll(){modal={type:'confirm',title:'Delete all data?',msg:'This will permanently delete all saved cash records from this browser.',action:'all'};render()}
function closeModal(){modal=null;render()}
function modalHtml(){if(modal.type==='save'){let names=[...new Map(entries.map(e=>[e.person.toLowerCase(),e.person])).values()];return '<div class="modalback" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h3>Save Entry</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="amountbox">'+money(total(calc,parseInt(loose)||0))+'</div><label class="fieldlabel">Person / Source (optional)</label><input id="mperson" class="field" placeholder="e.g. Ankit, Cash Counter"><div id="sugg" class="suggest" style="display:none"></div><label class="fieldlabel">Note (optional)</label><input id="mnote" class="field" placeholder="e.g. Morning collection"><div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="confirm" onclick="doSave()">Save</button></div></div></div>'}
return '<div class="modalback"><div class="modal"><div class="modalhead"><h3>'+modal.title+'</h3><button class="iconbtn" onclick="closeModal()">×</button></div><p>'+modal.msg+'</p><div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="confirm '+(modal.action==='clear'||modal.action==='all'?'red':'')+'" onclick="modalAction()">'+(modal.action==='all'?'Delete All Data':'Clear')+'</button></div></div></div>'}
function modalAction(){if(modal.action==='clear'){calc=empty();loose='';modal=null;render()}else{entries=[];save();modal=null;render()}}
function doSave(){let p=document.getElementById('mperson').value.trim()||'General',n=document.getElementById('mnote').value.trim(),l=parseInt(loose)||0,a=total(calc,l);entries.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),person:p,note:n,amount:a,denominations:{...calc},looseChange:l,timestamp:Date.now()});save();calc=empty();loose='';modal=null;render();showToast()}
function showToast(){let x=document.createElement('div');x.className='toast';x.textContent='✓ Entry saved';document.body.appendChild(x);setTimeout(()=>x.remove(),2000)}
function saveEdit(){let e=view.e;e.person=document.getElementById('eperson').value.trim()||'General';e.note=document.getElementById('enote').value.trim();e.looseChange=parseInt(document.getElementById('eloose').value)||0;document.querySelectorAll('.erow').forEach(i=>e.denominations[i.dataset.k]=parseInt(i.value)||0);e.amount=total(e.denominations,e.looseChange);entries=entries.map(x=>x.id===e.id?e:x);save();view=null;render();showToast()}
function editChange(k,n){let i=document.querySelector('.erow[data-k="'+k+'"]');if(!i)return;let q=Math.max(0,(parseInt(i.value)||0)+n);i.value=q||'';i.dispatchEvent(new Event('input'));let e=view.e;e.denominations[k]=q;e.amount=total(e.denominations,parseInt(document.getElementById('eloose').value)||0);document.getElementById('editTotal').textContent=money(e.amount)}
function deleteEdit(){modal={type:'confirm',title:'Delete this cash entry?',msg:'This entry will be permanently removed.',action:'delete'};render()}
function exportData(){let data={app:'cash-count',version:1,exportedAt:new Date().toISOString(),entries};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='cash-count-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.app!=='cash-count'||!Array.isArray(d.entries)||d.entries.some(x=>!valid(x)))throw 0;modal={type:'import',data:d.entries};render()}catch{alert('Invalid Cash Count backup file.')}};r.readAsText(f)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
function formatKey(k){let [y,m,d]=k.split('-').map(Number);return dateLong(new Date(y,m-1,d))}
document.addEventListener('input',e=>{if(e.target.id==='mperson'){let q=e.target.value.toLowerCase();let names=[...new Map(entries.map(x=>[x.person.toLowerCase(),x.person])).values()].filter(n=>q&&n.toLowerCase().includes(q)&&n.toLowerCase()!==q).slice(0,3),s=document.getElementById('sugg');if(!s)return;s.innerHTML=names.map(n=>'<button onclick="document.getElementById(\'mperson\').value='+JSON.stringify(n)+';sugg.style.display=\'none\'">'+esc(n)+'</button>').join('');s.style.display=names.length?'block':'none'}})
document.addEventListener('click',e=>{if(modal&&modal.type==='import'&&!e.target.closest('.modal'))closeModal()});
function modalAction(){if(modal.action==='clear'){calc=empty();loose='';modal=null;render();return}if(modal.action==='all'){entries=[];save();modal=null;render();return}if(modal.action==='delete'){entries=entries.filter(x=>x.id!==view.e.id);save();modal=null;view=null;render()}}
function importModal(){let n=modal.data.length;return '<div class="modalback"><div class="modal"><div class="modalhead"><h3>Import '+n+' entries?</h3><button class="iconbtn" onclick="closeModal()">×</button></div><p>Choose how to restore this backup.</p><div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="confirm" onclick="doImport()">Merge</button></div><button class="settingbtn" style="margin-top:8px" onclick="doImport(true)">Replace</button></div></div>'}
const oldModalHtml=modalHtml;modalHtml=function(){if(modal&&modal.type==='import')return importModal();return oldModalHtml()}
function doImport(replace=false){if(replace)entries=modal.data;else{let ids=new Set(entries.map(e=>e.id));entries=[...entries,...modal.data.filter(e=>!ids.has(e.id))].sort((a,b)=>a.timestamp-b.timestamp)}save();modal=null;render();showToast()}
render();
</script>
</body>
</html>
